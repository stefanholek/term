name: CI

on:
  push:
    branches: [main, workflow]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_PYTHON_VERSION_WARNING: 1

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", pypy-3.11]

    steps:
      - name: Install XTerm, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xterm xvfb

      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e .

      - name: List installed packages
        run: python -m pip list

      - name: Run tests
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            xterm -geometry 120x40 -e bash -c "python -m unittest discover -v > output.log 2>&1; echo \$? > exit.code"
          cat output.log
          exit "$(cat exit.code)"

  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]  # dill does not work with 3.15 yet

    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.cfg

      - name: Install dependencies
        run: python -m pip install -e .[pylint]

      - name: List installed packages
        run: python -m pip list

      - name: Run linter
        run: python -m pylint term

